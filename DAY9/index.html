<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
   
</head>
<body id="body">
    <form action="new.php" method="post" class="form" id="form">
        <h1>Registration form</h1>
       

        
        <label for="txtId">ID:</label>
        <input type="text" name="id" id="txtId" required placeholder="Enter your ID" />

        <label for="txtName">Name:</label>
        <input type="text" name="name" id="txtName" required placeholder="Enter your name" />
<br>
<br>
        <label for="txtRollNo">Roll Number:</label>
        <input type="text" name="roll_no" id="txtRollNo" required placeholder="Enter your roll number" />
<br>
        <label for="txtBranch">Branch:</label>
        <input type="text" name="branch" id="txtBranch" required placeholder="Enter your branch" />
<br>
        <label for="txtCgpa">CGPA:</label>
        <input type="text" name="cgpa" id="txtCgpa" required placeholder="Enter your CGPA" />
<br>
        <label for="txtPhone">Phone Number:</label>
        <input type="text" name="phone_no" id="txtPhone" required placeholder="Enter your phone number" />
        
<br>
 <button type="submit">Submit</button>
    </form>

</html>
